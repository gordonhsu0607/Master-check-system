<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>大師級達成率查詢</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--ink:#1c1b19;--mute:#6f6b62;--line:#e0dacb;--acc:#b3261e;--ok:#1d6b45;--btn:#1c1b19;--btnink:#fffdf8;--err-bg:#fbe9e7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15140f;--card:#1f1d17;--ink:#f1ede2;--mute:#9b968a;--line:#35322a;--acc:#ff7a70;--ok:#5fcf93;--btn:#f1ede2;--btnink:#15140f;--err-bg:#3a1f1c}}
:root[data-theme="dark"]{--bg:#15140f;--card:#1f1d17;--ink:#f1ede2;--mute:#9b968a;--line:#35322a;--acc:#ff7a70;--ok:#5fcf93;--btn:#f1ede2;--btnink:#15140f;--err-bg:#3a1f1c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.wrap{width:100%;max-width:420px}
.eyebrow{font-size:12px;letter-spacing:.28em;color:var(--mute);margin:0 0 10px}
h1{font-size:30px;font-weight:900;margin:0 0 6px;letter-spacing:.04em}
.sub{color:var(--mute);font-size:14px;margin:0 0 28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:28px 24px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:8px;letter-spacing:.08em}
input{width:100%;font:inherit;font-size:18px;letter-spacing:.08em;padding:12px 14px;border:1.5px solid var(--ink);border-radius:4px;background:transparent;color:var(--ink);text-transform:uppercase}
input:focus{outline:3px solid color-mix(in srgb,var(--acc) 35%,transparent);outline-offset:1px}
button{width:100%;margin-top:16px;font:inherit;font-weight:700;font-size:16px;letter-spacing:.12em;padding:13px;border:0;border-radius:4px;background:var(--btn);color:var(--btnink);cursor:pointer}
button.ghost{background:transparent;color:var(--mute);border:1px solid var(--line);margin-top:10px;font-weight:500}
button:disabled{opacity:.5;cursor:wait}
.err{background:var(--err-bg);color:var(--acc);border-left:4px solid var(--acc);padding:10px 12px;font-size:14px;margin-top:16px;border-radius:2px}
.hidden{display:none}
.row{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0;border-bottom:1px dashed var(--line)}
.row:last-of-type{border-bottom:0}
.k{color:var(--mute);font-size:13px;letter-spacing:.08em}
.v{font-size:22px;font-weight:700;letter-spacing:.15em}
.ask{margin:18px 0 0;font-size:14px;color:var(--mute);text-align:center}
.big{font-size:44px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
.res{padding:16px 0;border-bottom:1px dashed var(--line)}
.res:last-of-type{border-bottom:0}
.res .k{margin-bottom:6px}
.bar{height:8px;background:var(--line);border-radius:4px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.bar.full i{background:var(--ok)}
.goal{margin-top:8px;font-size:13px;color:var(--mute);letter-spacing:.06em}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;margin-left:8px;vertical-align:middle;border:1px solid currentColor}
.foot{font-size:12px;color:var(--mute);margin-top:18px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">MASTER ACHIEVEMENT</p>
  <h1>大師級達成率查詢</h1>
  <p class="sub">請輸入您的登入帳號進行查詢</p>

  <div class="card" id="s1">
    <label for="acc">登入帳號</label>
    <input id="acc" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="請輸入登入帳號" maxlength="20">
    <div class="err hidden" id="err"></div>
    <button id="go">查詢</button>
  </div>

  <div class="card hidden" id="s2">
    <div class="row"><span class="k">姓名</span><span class="v" id="nm"></span></div>
    <div class="row"><span class="k">經銷商</span><span class="v" id="dl"></span></div>
    <p class="ask">請確認以上資料是否為您本人</p>
    <button id="yes">確認,查看結果</button>
    <button class="ghost" id="no">不是我,重新輸入</button>
  </div>

  <div class="card hidden" id="s3">
    <div class="res"><div class="k">系統原始點數加總</div><div class="big" id="pt"></div></div>
    <div class="res"><div class="k">達成率<span class="tag" id="tg"></span></div><div class="big" id="rt"></div>
      <div class="bar" id="bar"><i id="fill"></i></div>
      <div class="goal">年度目標 60,000 點</div></div>
    <button class="ghost" id="back">返回,查詢其他帳號</button>
  </div>
  <p class="foot" id="foot"></p>
</div>

const SALT=new TextEncoder().encode('master-lookup-v1');
const ITER=100000;
const $=id=>document.getElementById(id);
let rec=null;
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
function mask(n){const a=[...n];if(a.length<=1)return n;if(a.length===2)return a[0]+'＊';return a[0]+'＊'.repeat(a.length-2)+a[a.length-1];}
function show(id){['s1','s2','s3'].forEach(s=>$(s).classList.toggle('hidden',s!==id));}
function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
async function lookup(acc){
  const enc=new TextEncoder().encode(acc);
  const idx=hex(await crypto.subtle.digest('SHA-256',new Uint8Array([...SALT,...enc])));
  const blob=DATA[idx]; if(!blob) return null;
  const raw=b64(blob);
  const km=await crypto.subtle.importKey('raw',enc,'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:SALT,iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(0,12)},key,raw.slice(12));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function go(){
  const acc=$('acc').value.trim().toUpperCase();
  const err=$('err'); err.classList.add('hidden');
  if(!acc){err.textContent='請輸入登入帳號';err.classList.remove('hidden');return;}
  $('go').disabled=true;$('go').textContent='查詢中…';
  try{ rec=await lookup(acc); }catch(e){ rec=null; }
  $('go').disabled=false;$('go').textContent='查詢';
  if(!rec){err.textContent='查無此帳號,請確認輸入是否正確';err.classList.remove('hidden');return;}
  $('nm').textContent=mask(rec.n);$('dl').textContent=rec.d;show('s2');
}
$('go').onclick=go;
$('acc').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
function reset(){rec=null;$('acc').value='';$('err').classList.add('hidden');show('s1');$('acc').focus();}
$('no').onclick=reset;$('back').onclick=reset;
$('yes').onclick=()=>{
  $('pt').textContent=rec.p.toLocaleString('en-US');
  const pct=rec.r*100;$('rt').textContent=pct.toFixed(1)+'%';
  const ok=pct>=100;$('tg').textContent=ok?'已達成':'未達成';$('tg').style.color=ok?'var(--ok)':'var(--acc)';
  $('bar').classList.toggle('full',ok);$('fill').style.width=Math.min(pct,100)+'%';
  show('s3');
};
</script>
